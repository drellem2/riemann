name: verifiers

# Re-runs the `notes/verify_*.py` scripts on a clean machine.  Each script is
# its own job, so the run page names every script it ran and how long it took —
# a single tick covering an unnamed subset would be worse than no CI at all.
#
# Eleven scripts run on their FULL grid.  Four run on the reduced grid their
# own `--quick` / `QUICK=1` switch selects, because their full grids exceed a
# sane per-push budget.  Which is which is recorded here, in the job names, and
# in README.md under "Continuous integration" — read that before reading a
# green tick as "every number in `notes/` was rechecked".  It is not that.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifiers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.script }} ${{ matrix.args }}${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- full grid (measured on a runner, longest 9m28s) --------------
          - {script: verify_semilocal_gap.py,       args: "", env: ""}
          - {script: verify_prolate_claims.py,      args: "", env: ""}
          - {script: verify_sign_claims.py,         args: "", env: ""}
          - {script: verify_arch_positivity.py,     args: "", env: ""}
          - {script: verify_h1.py,                  args: "", env: ""}
          - {script: verify_citation_u8.py,         args: "", env: ""}
          - {script: verify_q3.py,                  args: "", env: ""}
          - {script: verify_index_convention.py,    args: "", env: ""}
          - {script: verify_dunster.py,             args: "", env: ""}
          - {script: verify_q2.py,                  args: "", env: ""}
          - {script: verify_independent_recheck.py, args: "", env: ""}
          # --- reduced grid: full grid exceeds the per-push budget ----------
          # `--quick` / `QUICK=1` keep every check and coarsen the grid (fewer
          # bandwidths c, larger step).  They do not skip checks.
          - {script: verify_q1.py,                  args: "--quick", env: ""}
          - {script: verify_prolate_rate.py,        args: "--quick", env: ""}
          - {script: verify_deficit_repair.py,      args: "--quick", env: ""}
          - {script: verify_h0.py,                  args: "",        env: "QUICK=1"}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # numpy for the four Connes-Consani matrix scripts, mpmath for the
      # arbitrary-precision ones.  `verify_independent_recheck.py` needs
      # neither, by design — it is the standard-library second implementation.
      - run: pip install --quiet numpy mpmath

      # Several scripts import their siblings by bare module name, so the
      # working directory has to be `notes/`.
      - name: ${{ matrix.script }}
        working-directory: notes
        run: |
          set -o pipefail
          # Two scripts take their reduced grid from a `QUICK=1` environment
          # variable rather than a `--quick` argv flag, hence the `env` prefix.
          env ${{ matrix.env }} python "${{ matrix.script }}" ${{ matrix.args }} 2>&1 | tee run.log
          # These scripts REPORT; with three exceptions they do not exit
          # non-zero when a check they can decide comes out wrong — they print
          # a verdict word into a table cell and return 0.  So the exit status
          # alone would be green either way, and the verdict words have to be
          # promoted to the exit status here.  `(FAILS)` and `NO` are
          # deliberately NOT in this list: both appear in cells that are
          # EXPECTED to fail and are documented as such (see README.md).
          if grep -nE 'Traceback|REFUTED|MISMATCH' run.log; then
            echo "::error::${{ matrix.script }} printed a failing verdict (see the matched lines above)"
            exit 1
          fi
