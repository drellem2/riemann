name: verifiers

# Re-runs the `notes/verify_*.py` scripts on a clean machine.  Each script is
# its own job, so the run page names every script it ran and how long it took —
# a single tick covering an unnamed subset would be worse than no CI at all.
#
# Twelve scripts run on their FULL grid.  Six run on the reduced grid their
# own `--quick` / `QUICK=1` switch selects, because their full grids exceed a
# sane per-push budget.  Which is which is recorded here, in the job names, and
# in README.md under "Continuous integration" — read that before reading a
# green tick as "every number in `notes/` was rechecked".  It is not that.
#
# A nineteenth job, `exit-codes`, runs the positive control for the exit-code
# contract those eighteen depend on.  It belongs in this workflow rather than in
# its own: the thing it guards is the exit status of the same eighteen scripts,
# so the badge that goes green for them should be the badge that goes red when
# the status underneath it stops meaning anything.

on:
  push:
    branches: [main]
    # A docs-only push opens a full run of all three workflows — a five-line
    # edit to `docs/roadmap.md` (`e42b0f2`) built Lean, built the paper, and ran
    # nineteen verifier jobs — and such a run can displace a merge's queued one.
    # That is the original cause of mg-4bbd: that ticket stopped the CANCELLING
    # and left the PUSHING, so the population of interfering pushes stayed
    # exactly as large as it was.  This drops them.
    #
    # Scoped to `docs/**` deliberately.  `'**.md'` would be wrong here:
    # `notes/*.md` is the corpus and `README.md` records which verifier scripts
    # run reduced grids, so a change to either is a change CI should re-run.
    #
    # `paths-ignore` is under `push:` only, so the `pull_request:` trigger below
    # is untouched and a docs-only PR still gets all three checks.  That matters
    # because a required check that never reports leaves a PR either blocked
    # forever or merged on a check that did not run.  Measured 2026-08-14:
    # nothing requires them anyway — `gh api
    # repos/drellem2/riemann/branches/main/protection` returns 404 "Branch not
    # protected" and `gh api repos/drellem2/riemann/rulesets` returns `[]`.  If
    # protection is ever added, this is the line to re-read.
    #
    # `branches: [main]` above cannot be de-hardcoded the way the concurrency
    # block below is: trigger filters are matched before any expression context
    # exists, so no `${{ }}` is evaluated at this point in the file.
    paths-ignore: ['docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# `cancel-in-progress` is right on a PR branch — do not burn runners on a commit
# a later push has superseded — and wrong on `main`, where each push's run is
# the record of whether that commit was green.  `docs/roadmap.md` is regenerated
# within minutes of every merge, so with a bare `true` the merge's own run was
# routinely cancelled by the docs push behind it: five such runs on `main` on
# 2026-08-13 (665f05c, 79ec435, bd7edc5, d678fc0, a5a8651).  No coverage was
# lost — the superseding tree is the merge plus a roadmap edit — but the merge
# reads `cancelled`, and had any of those merges been red the failure would have
# surfaced on, and been blamed on, the roadmap commit that cancelled it.
#
# On `pull_request` events `github.ref` is `refs/pull/N/merge`, never
# `refs/heads/main`, so PR cancellation is unaffected.  That the expression
# yields a real boolean and not a truthy string was measured, not assumed; the
# measurement is recorded in mg-4bbd.
#
# The group carries the sha on the default branch, and that is a SECOND and
# separate mechanism from `cancel-in-progress`.  GitHub allows only one PENDING
# run per concurrency group: a push arriving while a run is in flight does not
# queue behind it, it EVICTS whatever was already pending.  `cancel-in-progress:
# false` governs the RUNNING run and has no bearing on that.  Both halves were
# measured on `main` on 2026-08-13: `fa6cf39` (mg-4bbd's own merge, 22:52:24)
# ran to completion despite two later pushes, which is the fix working, while
# `7314936` (22:53:27) was cancelled at 22:53:37 — one second after `bc2ca66`
# was pushed at 22:53:36 — having never started a single job (`gh run view
# 31751762413 --json jobs` returns `[]`).  So any two merges landing inside one
# run's lifetime left the middle sha with no completed run, and a displaced run
# leaves a `cancelled` row indistinguishable from a deliberate cancellation.
# One group per sha on the default branch means nothing can displace anything.
# Feature branches keep coalescing under the bare ref, which is what you want
# there: a superseded branch push has no independent value.
#
# Note the interaction with `paths-ignore` above: a merge whose whole diff is
# under `docs/**` opens no run on the default branch at all, so "every sha has a
# completed run" is a claim about shas that change something outside `docs/**`.
#
# The default branch is read from the event payload rather than hardcoded, so a
# branch rename cannot silently restore the pre-mg-4bbd behaviour.  That
# `github.event.repository.default_branch` is populated (`main`) was measured on
# both `push` and `workflow_dispatch` payloads, and that `<cond> && github.sha
# || ''` yields the full sha on the true arm and the empty string on the false
# arm was measured on the same runner rather than assumed — mg-121d.  The
# default-branch arm itself cannot be exercised from a branch: it is true only
# once this file is ON the default branch.
concurrency:
  group: verifiers-${{ github.ref }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  verify:
    name: ${{ matrix.script }} ${{ matrix.args }}${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- full grid (measured on a runner, longest 9m28s) --------------
          - {script: verify_semilocal_gap.py,       args: "", env: ""}
          - {script: verify_prolate_claims.py,      args: "", env: ""}
          - {script: verify_sign_claims.py,         args: "", env: ""}
          - {script: verify_arch_positivity.py,     args: "", env: ""}
          - {script: verify_h1.py,                  args: "", env: ""}
          - {script: verify_citation_u8.py,         args: "", env: ""}
          - {script: verify_q3.py,                  args: "", env: ""}
          - {script: verify_index_convention.py,    args: "", env: ""}
          - {script: verify_dunster.py,             args: "", env: ""}
          - {script: verify_q2.py,                  args: "", env: ""}
          - {script: verify_independent_recheck.py, args: "", env: ""}
          - {script: verify_sonin_trace.py,         args: "", env: ""}
          # --- reduced grid: full grid exceeds the per-push budget ----------
          # `--quick` / `QUICK=1` keep every check and coarsen the grid (fewer
          # bandwidths c, larger step).  They do not skip checks.
          - {script: verify_sonin_margin.py,        args: "--quick", env: ""}
          - {script: verify_sonin_ceiling.py,       args: "--quick", env: ""}
          - {script: verify_q1.py,                  args: "--quick", env: ""}
          - {script: verify_prolate_rate.py,        args: "--quick", env: ""}
          - {script: verify_deficit_repair.py,      args: "--quick", env: ""}
          - {script: verify_h0.py,                  args: "",        env: "QUICK=1"}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # numpy for the five Connes-Consani matrix scripts, mpmath for the
      # arbitrary-precision ones.  `verify_independent_recheck.py` needs
      # neither, by design — it is the standard-library second implementation.
      #
      # FLOORS, NOT PINS.  numpy >= 2.0 is a hard requirement: the scripts call
      # `np.trapezoid`, which is what `np.trapz` was renamed to when 2.0 removed
      # the old name.  Until 2026-08-13 this line was `numpy mpmath` with no
      # constraint at all and nothing anywhere stated a supported version, which
      # is how `verify_sonin_trace.py` reached `main` calling the removed name
      # and died here twelve seconds in.  See README.md, "The versions these
      # scripts are run on", for why these stay floors and are not pinned.
      - run: pip install --quiet "numpy>=2.0" "mpmath>=1.3"

      # Several scripts import their siblings by bare module name, so the
      # working directory has to be `notes/`.
      - name: ${{ matrix.script }}
        working-directory: notes
        run: |
          set -o pipefail
          # Two scripts take their reduced grid from a `QUICK=1` environment
          # variable rather than a `--quick` argv flag, hence the `env` prefix.
          env ${{ matrix.env }} python "${{ matrix.script }}" ${{ matrix.args }} 2>&1 | tee run.log
          # These scripts REPORT; with three exceptions they do not exit
          # non-zero when a check they can decide comes out wrong — they print
          # a verdict word into a table cell and return 0.  So the exit status
          # alone would be green either way, and the verdict words have to be
          # promoted to the exit status here.  `(FAILS)` and `NO` are
          # deliberately NOT in this list: both appear in cells that are
          # EXPECTED to fail and are documented as such (see README.md).
          if grep -nE 'Traceback|REFUTED|MISMATCH' run.log; then
            echo "::error::${{ matrix.script }} printed a failing verdict (see the matched lines above)"
            exit 1
          fi

  # The positive control: every one of the eighteen is run once with its first
  # decision forced negative and must exit non-zero naming that decision, and
  # the three fastest are run unforced and must exit 0.  A contract that cannot
  # fail is a green tick that means nothing, and before this job nothing but a
  # human's memory ran the control that rules that out.
  #
  # The forced runs stop at the first decision, so this is cheap — 1m00s and
  # 1m34s on two runs on a developer machine, against 20+ minutes for the grids
  # above.  Not yet measured on a runner; the timeout is set well clear of it.
  exit-codes:
    name: exit-code contract (positive control)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same floors as the `verify` job above, for the same reason.
      - run: pip install --quiet "numpy>=2.0" "mpmath>=1.3"

      - name: test_exit_codes.py
        working-directory: notes
        # Exits 0 if every script has a reachable failing exit path, 1 if any
        # script's contract came out wrong, 2 if this runner could not import
        # what the scripts need — in which case the contract was not tested and
        # the fix is the `pip install` line above, not the scripts.
        run: python test_exit_codes.py
