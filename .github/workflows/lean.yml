name: lean

# Re-runs `lean/scripts/check.sh` on a clean machine: the build, the `sorry`
# grep, and the axiom audit.  The script exits non-zero if the build fails, if
# `sorry` appears in the sources, or if any result depends on `sorryAx`.
#
# The toolchain and the mathlib revision are pinned (`lean/lean-toolchain`,
# `lean/lake-manifest.json`).  `leanprover/lean-action` installs elan and runs
# `lake exe cache get`, which fetches prebuilt mathlib oleans — mathlib is
# NEVER compiled from source here; see `lean/README.md`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# `cancel-in-progress` is right on a PR branch — do not burn runners on a commit
# a later push has superseded — and wrong on `main`, where each push's run is
# the record of whether that commit was green.  `docs/roadmap.md` is regenerated
# within minutes of every merge, so with a bare `true` the merge's own run was
# routinely cancelled by the docs push behind it: five such runs on `main` on
# 2026-08-13 (665f05c, 79ec435, bd7edc5, d678fc0, a5a8651).  No coverage was
# lost — the superseding tree is the merge plus a roadmap edit — but the merge
# reads `cancelled`, and had any of those merges been red the failure would have
# surfaced on, and been blamed on, the roadmap commit that cancelled it.
#
# On `pull_request` events `github.ref` is `refs/pull/N/merge`, never
# `refs/heads/main`, so PR cancellation is unaffected.  That the expression
# yields a real boolean and not a truthy string was measured, not assumed; the
# measurement is recorded in mg-4bbd.
concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: build, sorry grep, axiom audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Installs the pinned toolchain, fetches the mathlib cache, and runs
      # `lake build`.  `check.sh` below re-runs `lake build` (a no-op by then)
      # and adds the two checks the action does not do.
      - name: Set up Lean and fetch the mathlib cache
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: true
          test: false
          lint: false
          use-mathlib-cache: true

      - name: lean/scripts/check.sh
        run: ./lean/scripts/check.sh
